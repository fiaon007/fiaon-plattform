<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom bleibt erlaubt. `user-scalable=no` sperrt Menschen mit
         eingeschränktem Sehvermögen aus und ist bei Lighthouse ein
         Barrierefreiheits-Fehler. Agenten arbeiten am Handy und müssen eine
         Telefonnummer vergrößern können. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    
    <!-- ── BROWSER-IDENTITÄT (11.08.2026) ────────────────────────────────
         Bis heute gab es KEIN Favicon. Der Browser zeigte auf jedem Tab sein
         generisches Ersatzzeichen — auf einer Leiste mit zehn offenen Tabs
         war FIAON das einzige ohne Gesicht.

         SVG zuerst: Es ist scharf auf jedem Bildschirm und trägt die
         Hell-/Dunkel-Umschaltung in sich. Das PNG ist der Rückfall für
         Browser ohne SVG-Favicon (Safari älter als 16). -->
    <!-- Vorher: SVG-Wortmarke. Nachher (24.08., Justin): Higgsfield-Icon (Glas-F mit Ring) als PNG-Satz. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0A1A3C" />

    <!-- Primary Meta Tags -->
    <title>FIAON – Das Betriebssystem für Bonität</title>

    <meta name="keywords" content="Bonität verbessern, SCHUFA Eintrag löschen, Bonitätsauskunft, KSV1870, CRIF, Kontoauszug Analyse, Kreditkarte trotz SCHUFA, FIAON" />
